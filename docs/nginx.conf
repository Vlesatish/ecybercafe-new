# Hostinger VPS / Nginx Proxy Configuration
# Split Architecture: Frontend (ecybercafe.in) + API Server (api.ecybercafe.in)

# =========================================================
# 1. FRONTEND SERVER BLOCK (https://ecybercafe.in)
# =========================================================
server {
    listen 80;
    server_name ecybercafe.in www.ecybercafe.in;

    # Root directory containing compiled React Vite static files
    root /var/www/ecybercafe/dist;
    index index.html;

    client_max_body_size 100M;

    # Static assets caching
    location /assets/ {
        expires 30d;
        add_header Cache-Control "public, no-transform";
    }

    # Uploaded Files Proxy
    location /uploads/ {
        alias /var/lib/ecybercafe/uploads/;
        expires 30d;
        add_header Cache-Control "public, no-transform";
    }

    # Reverse proxy for /api/ requests if made directly to ecybercafe.in
    location /api/ {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Single Page Application (SPA) Fallback to index.html
    location / {
        try_files $uri $uri/ /index.html;
    }
}

# =========================================================
# 2. BACKEND API SERVER BLOCK (https://api.ecybercafe.in)
# =========================================================
server {
    listen 80;
    server_name api.ecybercafe.in;

    client_max_body_size 100M;

    # Timeout limits for large PDF processing and file uploads
    proxy_connect_timeout 300s;
    proxy_send_timeout    300s;
    proxy_read_timeout    300s;
    send_timeout          300s;

    # Access to uploaded files via API subdomain
    location /uploads/ {
        alias /var/lib/ecybercafe/uploads/;
        expires 30d;
        add_header Cache-Control "public, no-transform";
    }

    # Proxy all API requests directly to Express Node.js running on Port 3000
    location / {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_cache_bypass $http_upgrade;
    }
}

